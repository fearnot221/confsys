name: Platform quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:setup
      - run: pnpm infra:up
      - run: pnpm db:migrate
      - run: pnpm db:migrate:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm compose --profile app build
      - run: pnpm compose --profile app run --rm migrate
      - run: pnpm compose --profile app up -d --no-build --wait api worker web
      - run: pnpm smoke:stack
      - run: pnpm smoke:auth
      - run: pnpm test:instances
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: always()
        run: |
          pnpm compose --profile app down -v
          for envfile in .instances/*/[ab].env; do
            [ -f "$envfile" ] || continue
            CONFSYS_ENV_FILE="$envfile" pnpm compose --profile app down -v
          done
